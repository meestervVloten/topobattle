<style>
*{box-sizing:border-box}body{font:17px system-ui,sans-serif;background:#10172e;color:white;margin:0}
main,header{max-width:950px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
a{color:#fff}h1{font-size:36px}.card{background:#202d52;border:1px solid #45577d;border-radius:22px;padding:25px;margin-bottom:18px}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{min-height:70px}
.correct{background:#147765!important}.wrong{background:#a4395a!important}
.overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#0c1639ba;text-align:center;border-radius:17px}
.overlay.show{display:flex}.overlay>div{background:#142344;padding:22px 35px;border-radius:18px;border:2px solid #8da2d1}
#number{font-size:110px;font-weight:1000;line-height:1}
.bar{background:#14213c;height:10px;border-radius:20px;margin:15px 0}.bar>div{height:100%;background:#4ed6e7;width:100%;border-radius:20px}
#game,#end{display:none}.muted{color:#cbd7f5}
@media(max-width:650px){.controls,.answers{grid-template-columns:1fr}.card{padding:16px}.flagbox{min-height:200px}#number{font-size:76px}}
</style><header><strong>🌍 TOPO BATTLE · 🚩 VLAGGEN</strong><a href="index.html">← Terug naar de kaartspellen</a></header><main>
<section id="setup" class="card"><h1>🚩 Vlaggen Battle</h1><p class="muted">Raad van welk land de vlag is. Speel direct, zonder kamer!</p>
<div class="controls"><div><label for="region">Werelddeel</label><select id="region"><option value="Europe">Europa</option><option value="Asia">Azië</option><option value="Africa">Afrika</option><option value="North America">Noord-Amerika</option><option value="South America">Zuid-Amerika</option><option value="Oceania">Oceanië</option><option value="World">Hele wereld</option></select></div>
<div><label for="rounds">Aantal vragen</label><select id="rounds"><option>10</option><option>15</option><option>20</option><option>30</option><option value="all">Alle vlaggen</option></select></div>
<div><label for="duration">Tijd per vraag</label><select id="duration"><option>10</option><option>15</option><option selected>20</option><option>30</option><option>60</option></select></div></div>
<button class="primary" id="start">▶ Start vlaggenspel</button><p class="muted">Vlaggen worden via FlagCDN geladen; internet is vereist.</p></section>
<section id="game" class="card"><div class="meta"><span id="round">Vraag 1</span><span>⭐ <span id="score">0</span> punten</span><span>⏱ <span id="clock">20</span>s</span></div><div class="bar"><div id="bar"></div></div>
<h2>Bij welk land hoort deze vlag?</h2><div class="flagbox"><img id="flag" alt="Te raden vlag"><div id="overlay" class="overlay"><div><div>VOLGENDE VRAAG OVER</div><div id="number">3</div><div id="correctName"></div></div></div></div>
<div class="answers" id="answers"></div><p id="feedback" aria-live="polite"></p></section>
<section id="end" class="card"><h1>🏁 Einde!</h1><p id="result"></p><button class="primary" id="again">Opnieuw spelen</button></section>

const $=id=>document.getElementById(id);
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let questions=[],index=0,score=0,correct=0,duration=20,seconds=20,active=null,answered=false,timer=null,transition=null,version=0;
function clearTimers(){clearInterval(timer);clearInterval(transition);version++}
function start(){
 clearTimers();let region=$('region').value;
 let options=COUNTRIES.filter(c=>region==='World'||c.regions.includes(region));
 let count=$('rounds').value==='all'?options.length:Math.min(+($('rounds').value),options.length);
 questions=shuffle(options).slice(0,count);index=0;score=0;correct=0;duration=+$('duration').value;
 $('setup').style.display='none';$('end').style.display='none';$('game').style.display='block';$('score').textContent=0;show();
}
function show(){
 clearTimers();answered=false;active=questions[index];seconds=duration;$('overlay').classList.remove('show');
 $('round').textContent='VRAAG '+(index+1)+' / '+questions.length;$('feedback').textContent='';
 $('flag').src='https://flagcdn.com/w640/'+active.code+'.png';
 $('flag').onerror=()=>{$('feedback').textContent='De vlag kon niet worden geladen. Controleer de internetverbinding.'};
 const region=$('region').value;
 const distractors=shuffle(COUNTRIES.filter(c=>c.code!==active.code&&(region==='World'||c.regions.includes(region)))).slice(0,3);
 $('answers').replaceChildren();
 for(const c of shuffle([active,...distractors])){let b=document.createElement('button');b.textContent=c.name;b.dataset.code=c.code;b.onclick=()=>answer(c.code);$('answers').append(b)}
 tick();const v=version;timer=setInterval(()=>{if(v!==version)return;seconds=Math.max(0,seconds-1);tick();if(!seconds)answer(null)},1000);
}
function tick(){$('clock').textContent=seconds;$('bar').style.width=(100*seconds/duration)+'%'}
function answer(choice){
 if(answered)return;answered=true;clearInterval(timer);
 if(choice===active.code){correct++;let points=100+Math.round(100*seconds/duration);score+=points;$('score').textContent=score;$('feedback').textContent='✅ Goed! +'+points+' punten'}
 else $('feedback').textContent=choice===null?'⏰ Tijd is om!':'❌ Helaas!';
 for(const b of $('answers').children){b.disabled=true;if(b.dataset.code===active.code)b.classList.add('correct');else if(b.dataset.code===choice)b.classList.add('wrong')}
 let n=3;const v=version;$('overlay').classList.add('show');$('number').textContent=n;$('correctName').textContent='Juiste antwoord: '+active.name;
 transition=setInterval(()=>{if(v!==version)return;--n;if(n>0){$('number').textContent=n;return}clearInterval(transition);index++;if(index===questions.length)finish();else show()},1000);
}
function finish(){clearTimers();$('game').style.display='none';$('end').style.display='block';$('result').textContent=correct+' van '+questions.length+' goed · '+score+' punten'}
$('start').onclick=start;$('again').onclick=()=>{$('end').style.display='none';$('setup').style.display='block'};
</script></html>
